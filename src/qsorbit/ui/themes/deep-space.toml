# Deep Space -- The default. A dark instrument panel for a dark room.
#
# Palette tokens are named for what they are for, not what colour they are.
# Every widget, stylesheet and custom-drawn alike, styles itself from these.
#
# Copy this file into the themes/ folder beside your config.toml, keep the
# same filename, and yours is used instead of this one.

# Optional. Absent means 1. Declare it if you publish a theme, so a build
# that cannot read it can say so clearly instead of guessing.
format = 1
name = "Deep Space"
author = "QSOrbit"
description = "The default. A dark instrument panel for a dark room."
url = "https://github.com/QSOrbit/qsorbit"

[palette]
bg        = "#0d1117"
panel     = "#161b22"
panel_alt = "#1c2330"
inset     = "#0a0e14"
edge      = "#2a3342"
text      = "#c9d4e3"
dim       = "#6e7d91"
accent    = "#4cc2ff"
ok        = "#3fd68f"
warn      = "#ffb454"
alarm     = "#ff6a6a"

# The colormap is part of the theme. Positions span 0.0 to 1.0 and must
# rise strictly; brightness rises (or, for a light theme, falls) monotonically
# across the whole ramp so "brighter is stronger" holds everywhere.
[waterfall]
stops = [
    [0.0, "#0a0e14"],
    [0.35, "#0a3c6e"],
    [0.6, "#1e8cbe"],
    [0.8, "#f0b450"],
    [1.0, "#fff0dc"],
]
