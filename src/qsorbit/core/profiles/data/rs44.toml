# RS-44 (DOSAAF-85) -- the single best first target for proving the
# receive chain: unconditional beacon, large 70cm Doppler excursion.
# NORAD id verified against AMSAT's own TLE catalog and AMSAT's RS-44
# page (https://www.amsat.org/two-way-satellites/rs-44/), 2026-08-28.
norad_id = 44909
name = "RS-44"
also_known_as = ["DOSAAF-85"]

[alive]
status = "active"
as_of = 2026-08-25
source = "bench-targets.md, checked against AMSAT Live OSCAR Satellite Status (https://www.amsat.org/status/) and AMSAT's RS-44 page"

[[transmitters]]
downlink_hz = 435605000.0
mode = "cw"
reliability = "unconditional"
notes = "CW beacon, sends 'RS44' every 10 s. Unconditional, 70cm so the Doppler excursion is large (~+/-10 kHz), and a keyed carrier draws a textbook sloping trace on the waterfall. The single best first target for proving Doppler correction (Session 22: FO-29/RS-44 bench day, r-squared 0.945-0.990 against predicted drift)."

[[transmitters]]
downlink_hz = 435640000.0
uplink_hz = 145965000.0
mode = "ssb"
reliability = "dependent"
notes = "Linear inverting transponder, 435.610-435.670 MHz down / 145.935-145.995 MHz up, SSB/CW, never FM. Silent unless another station is working through it."
