# AO-73 (FUNcube-1) -- telemetry beacon that only transmits in
# sunlight (an orbital constraint, not an operator-cooperation one --
# see ReliabilityClass's own docstring for why that still counts as
# unconditional). NORAD id verified against AMSAT's own TLE catalog,
# 2026-08-28.
norad_id = 39444
name = "AO-73"
also_known_as = ["FUNcube-1"]

[alive]
status = "active"
as_of = 2026-08-25
source = "bench-targets.md, checked against AMSAT Live OSCAR Satellite Status (https://www.amsat.org/status/)"

[[transmitters]]
downlink_hz = 145935000.0
mode = "bpsk"
baud = 1200.0
reliability = "unconditional"
notes = "Telemetry beacon, 1200 baud BPSK. Runs in sunlight only -- expect silence in eclipse, which is an orbital fact rather than nobody transmitting. Lower Doppler than the 70cm targets in this catalogue."

[[transmitters]]
downlink_hz = 145950000.0
uplink_hz = 435150000.0
mode = "ssb"
reliability = "dependent"
notes = "Linear transponder, 435.150 MHz up / 145.950 MHz down. Silent unless another station is working through it."
