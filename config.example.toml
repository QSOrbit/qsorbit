# QSOrbit station configuration — example
#
# Copy this file to one of the locations QSOrbit searches, in order of
# precedence:
#
#   1. wherever you point --config
#   2. ./qsorbit.toml            (the current working directory)
#   3. the per-user config directory:
#        Windows  %APPDATA%\qsorbit\config.toml
#        macOS    ~/Library/Application Support/qsorbit/config.toml
#        Linux    ~/.config/qsorbit/config.toml
#
# Then replace every value below with your own. Nothing here is
# guessed at runtime: missing keys and unknown keys are both startup
# errors, on purpose. A misspelled travel limit that silently fell back
# to a default would be a limit you believe is protecting your hardware
# and isn't.


# ---------------------------------------------------------------------
# Where your antenna is
# ---------------------------------------------------------------------
[observer]

# Degrees. North and east are positive; south and west are negative.
latitude = 40.0000
longitude = -83.0000

# Height above the WGS84 ellipsoid, in metres. Optional, defaults to 0.
# Pointing accuracy barely notices this for satellites; it is here
# because it costs nothing and matters for anything closer.
altitude_m = 250.0


# ---------------------------------------------------------------------
# How to reach the rotator
# ---------------------------------------------------------------------
[rotor]

# Serial port. "COM5" on Windows, "/dev/ttyUSB0" on Linux,
# "/dev/tty.usbserial-0001" or similar on macOS.
port = "COM5"

# Optional. The stock SatNOGS firmware hard-codes 19200
# (#define BAUDRATE 19200), which is the default here.
baudrate = 19200

# Optional. How long a single read may block, in seconds. This is not
# the RS-485 turnaround below — this one bounds waiting, that one paces
# the gap between writing a command and reading its reply.
timeout_s = 1.0

# Optional. Which [rotor.profiles.NAME] table below to track with.
# Defaults to "stock". Override for one run with --rotor-profile.
profile = "stock"


# ---------------------------------------------------------------------
# What your rotator may safely be told to do
# ---------------------------------------------------------------------
#
# READ THIS SECTION PROPERLY BEFORE CHANGING IT.
#
# The SatNOGS firmware applies no limits to a commanded position — not
# at the command handler, and not in the control loop either. It will
# accept AZ9999 and drive toward it until someone cuts power. These
# values are the only thing standing between a bad number and your
# hardware.
#
# They also differ between two builds of the same design, which is why
# none of them are inferred from the firmware version.
[rotor.capabilities]

# AXIS TRAVEL LIMITS — how far each joint may rotate from where it
# homed. These are NOT sky angles, and in particular elevation here is
# not "how high you can point".
#
# Everywhere a person looks — what you type, what QSOrbit prints, what
# a satellite's position is — elevation runs 0 to 90, because you
# cannot point higher than straight up. This section is the other side
# of that translation: the boom on many builds keeps rotating past
# vertical, and an axis reading of 135 means it has swung over the top
# and is pointing down the far side. That is a real place the joint can
# be, and it is worth declaring, because reaching a target at 45
# elevation by rotating the boom to 135 and the base 180 degrees round
# is how a pass near the zenith gets tracked without the azimuth axis
# whipping half a turn mid-pass.
#
# Set elevation_max_deg to 90.0 if your boom physically stops at
# vertical. Set it to 180.0 only if you have confirmed it can rotate
# past. A command outside these limits is refused and never
# transmitted.
azimuth_min_deg = 0.0
azimuth_max_deg = 360.0
elevation_min_deg = 0.0
elevation_max_deg = 180.0

# What your rotator does when commanded past 360 degrees. This one
# cannot be guessed, and guessing wrong causes physical damage:
#
#   "extra_rotation"   Commanding 380 spins the axis the whole way
#                      around and settles at 20. There is no travel
#                      past 360; the extra turn is pure cable wrap.
#                      Verified behaviour on a stock SatNOGS build.
#
#   "extended_travel"  The axis really does have more than 360 degrees
#                      of travel, so 20 and 380 are different physical
#                      places. Only on such a rotor is it safe to
#                      command azimuth + 360 to get through a pass that
#                      crosses north without hitting a cable stop.
#
# If you have not tested which one your rotator does, use
# "extra_rotation" — it is the more cautious of the two.
azimuth_wrap = "extra_rotation"

# How close to the target an axis must settle to count as arrived.
#
# This is not a tolerance for sloppiness. With stock PID gains (Ki = 0
# on both axes) an axis stops once the control output drops below what
# the motor needs to break static friction, which leaves a steady-state
# shortfall of roughly 1.5 degrees in azimuth and 2.1 in elevation on a
# perfectly healthy rotator. A window smaller than that reports every
# successful move as a failure. Fine for VHF/UHF beamwidths; revisit it
# for anything narrower.
acceptance_window_deg = 2.5

# Gap between writing a command and reading its reply, in seconds. The
# link is half-duplex, so the transceiver needs time to turn around.
# 0.15 is reliable on a short link; 0.3 to 0.5 is safer on long cable.
# An empty reply is far more often a too-short gap than a real fault.
rs485_turnaround_s = 0.15

# Optional. The firmware version this configuration was verified
# against. QSOrbit compares it to what the rotator reports at connect
# and warns on a mismatch. It is never used to infer any of the values
# above.
firmware_version = "SatNOGS-v2.2.1"

# Optional, and all four together or none at all: the two mechanical
# measurements QSOrbit needs before it will let a profile run a non-zero
# integral gain. Measure them, do not copy these -- two builds of the
# same design differ, and these are one rotator's numbers.
# See bench-procedure-mechanical-slop.md for the protocol.
#
# free_play_deg is peak-to-peak movement of the boom with the motors
# holding, in degrees. It sets how long a jam takes to notice: the stall
# detector cannot open its gate until the commanded setpoint has
# advanced past the slop.
#
# breakaway_pwm is the drive count at which that axis starts moving from
# rest. It is the ceiling a frozen integral term must stay under -- below
# it, a wound-up integral is harmless; above it, the axis drives itself
# with nothing commanding it, and stock firmware has no way to discharge
# an integral over serial.
#
# The two combine as  0.5 x Ki x free_play^2 / rate  PWM, validated at
# 0.25 deg/s. Note the square: halving the free play quarters the
# exposure. `qsorbit status` prints the maximum safe Ki for each axis.
azimuth_free_play_deg = 2.95
azimuth_breakaway_pwm = 17.0
elevation_free_play_deg = 2.55
elevation_breakaway_pwm = 21.0


# ---------------------------------------------------------------------
# Tracking profiles
# ---------------------------------------------------------------------
#
# This whole section is optional. Without it QSOrbit tracks exactly as
# it always has: a deadband equal to acceptance_window_deg above, at a
# one-second tick.
#
# A profile is how hard this station drives its rotor. Two numbers:
#
#   deadband_deg   How far the target must move before a new position
#                  is commanded. This is NOT the acceptance window.
#                  The window says where the rotor settles; the
#                  deadband says how often you bother telling it to
#                  move. They used to be the same value, and that
#                  coupling hid the fact that the deadband was never
#                  configurable at all.
#
#   interval_s     Seconds between tracking ticks.
#
# THE STEP YOU GET IS NOT THE DEADBAND. The loop can only command in
# whole ticks, so the real step is (rate x interval_s) rounded up to
# the deadband. Against a satellite moving 1 deg/s near zenith, a
# 2.5 deg deadband at a 1 s tick commands 3.0 deg steps — measured on
# hardware, not calculated after the fact. `qsorbit status` prints the
# step this configuration will actually command.
#
# AND THE KNIFE EDGE: if deadband_deg lands on a whole multiple of
# (rate x interval_s), whether a command fires on this tick or the next
# is decided by timing jitter rather than geometry, and the step
# silently doubles. A run configured for 1.0 deg steps was measured
# producing 1.15, 2.00, 1.97, 1.95. QSOrbit refuses that configuration
# rather than letting it be written by accident.

# The shipped behaviour, stated explicitly rather than inherited.
[rotor.profiles.stock]
deadband_deg = 2.5
interval_s = 1.0

# The bench-validated set: 0.5 deg steps at a half-second tick. On this
# station it took azimuth mean lag from 3.57 to 0.64 degrees and made
# the tracking 5-17x more repeatable, and it is markedly more robust to
# wind. It wants the matching controller gains to be worth running —
# without them this is cadence alone, which flattens out at the rotor's
# stiction floor.
#
# arrival_window_deg is optional and overrides acceptance_window_deg
# while this profile is active, because where the rotor settles is a
# property of the gains it is running: 2.5 deg is a stock-gains fact,
# and this set settles inside a degree.
[rotor.profiles.tracking]
deadband_deg = 0.25
interval_s = 0.5
arrival_window_deg = 1.0

# The gains half of the validated set.
#
# All six or none: whatever you leave out keeps the firmware's compiled
# default, so a partial set runs a mixture nobody chose.
#
# THE AZIMUTH Ki IS 0.97, NOT THE 1.0 SESSION 32 VALIDATED, and the
# reason is worth reading before you change it.
#
# QSOrbit refuses any integral gain that could wind past the motor's
# breakaway before a stall is detected. Against the measurements above:
#
#   azimuth:  0.5 x 1.00 x 2.95^2 / 0.25 = 17.40 PWM  vs  17 breakaway
#   azimuth:  0.5 x 0.97 x 2.95^2 / 0.25 = 16.88 PWM  vs  17 breakaway
#   elevation: 0.5 x 1.00 x 2.55^2 / 0.25 = 13.01 PWM vs  21 breakaway
#
# So elevation takes the validated 1.0 unchanged and azimuth misses by
# 2.4%. 0.97 is the largest this rotator's own mechanics permit.
#
# This is rounding, not fitting. A value chosen to satisfy a validator
# would be bad reasoning; a value 3% below a measured one, where the
# measurement's own run-to-run spread is wider than 3%, is the nearest
# safe point to what was validated. Session 32's candidate runs varied
# more than that between repeats of an identical configuration.
#
# CAVEAT, and do not let it get lost: the asymmetric pair (az 0.97,
# el 1.00) has never been bench-run together. The axes are independent
# loops in the firmware, so there is no control-path reason for the
# asymmetry to matter, but that is an argument rather than a
# measurement.
#
# The better fix is still to measure free_play_deg against wind rather
# than a hand push -- 2.95 is somebody leaning on a boom, and still air
# reads 0.00 over 15 seconds. Anything at or under 2.91 restores Ki 1.00
# on azimuth. Note that free play enters SQUARED, and wind force goes as
# the square of wind speed, so deflection scales as v^2 and this
# exposure as v^4: measure the wind at the same moment or the number
# means nothing.
#
# Kd is listed for completeness, not as a knob worth turning: raising it
# was measured and REFUTED. Derivative control closes a velocity loop
# around a spring, and the boom's torsional ring-back is that spring, so
# the term pumps the oscillation it is meant to damp. Every number got
# worse.
azimuth_kp = 8.0
azimuth_ki = 0.97
azimuth_kd = 0.5
elevation_kp = 10.0
elevation_ki = 1.0
elevation_kd = 0.3


# ---------------------------------------------------------------------
# Alignment offset
# ---------------------------------------------------------------------
#
# This whole section is optional. Every config file written before
# Chunk I lacks it, and no measurement is exactly this feature's
# identity value: azimuth_deg = 0.0, elevation_deg = 0.0 means "no
# correction applied", which is an honest description of a station
# nobody has calibrated yet - not a placeholder standing in for a
# required measurement.
#
# The rotor's axis reading is measured from wherever it homed, not from
# true north - see [rotor.capabilities] above and
# qsorbit-rotor-integration.md section 4. This offset is the difference
# between the two, so QSOrbit can convert one into the other. Measure
# it by pointing the boom at something whose true sky azimuth you know
# (a landmark, the sun with a peep sight, a known star), reading the
# rotor's own axis position for that same moment, and subtracting:
#
#     azimuth_deg = axis_reading_azimuth - true_sky_azimuth
#
# and the equivalent for elevation, usually 0 unless the mast itself
# sits off level. There is no auto-calibration routine yet - that is
# planned future work - so today this number is typed in by hand.
#
# On a permanently mounted station this is a station constant: measure
# it once, leave it here. On a portable rig re-aimed by hand at every
# setup - the case this was written for - there is no persistent
# reference between setups, so this needs re-measuring and re-entering
# each time, the same way you would re-level a tripod.
#[rotor.alignment]
#azimuth_deg = 0.0
#elevation_deg = 0.0


# ---------------------------------------------------------------------
# How to reach your SDR
# ---------------------------------------------------------------------
#
# This whole section is optional. A station that only points an antenna
# is a complete station, and every config file written before Phase 2
# does without it.
#
# Note what is NOT here: centre frequency, sample rate and gain. Those
# change when you point at a different satellite, so they belong with
# the per-satellite profile that asks for them, not with the station.
# Gain especially is a per-pass judgement — 32.8 dB suited FM broadcast
# and 49.6 dB suited NOAA weather radio on the same evening — and
# freezing it here would make it look like a property of your station.
[sdr]

# Directory containing librtlsdr.
#
# Effectively REQUIRED ON WINDOWS, and for a reason that is not
# obvious: since Python 3.8 neither the working directory nor PATH is
# searched when resolving a DLL, so the vendor's "copy rtlsdr.dll next
# to your software" instruction does nothing here. QSOrbit registers
# this directory explicitly instead.
#
# Point it at the x64 folder of the RTL-SDR Blog driver release. The
# Blog build specifically: an RTL-SDR Blog V4 driven by a stock
# librtlsdr enumerates, opens and streams perfectly happily while
# tuning somewhere other than where it was told. QSOrbit refuses to
# open a V4 through a library it can prove is not the Blog fork, but it
# cannot prove the converse, so this is worth getting right.
#
# On Linux and macOS, leave it out — the package manager puts the
# library somewhere the loader already looks.
# Note the single quotes. In TOML they mean "take this string
# literally", so Windows backslashes need no escaping. With double
# quotes every backslash has to be doubled, because "\U" begins a
# Unicode escape and would make this file fail to parse outright.
driver_dir = 'C:\Users\you\dev\rtlsdr-blog\x64'

# Optional. Which device to open when more than one is attached.
# Defaults to 0, which is the only device on a single-dongle station.
device_index = 0

# Optional, defaults to 0. Crystal frequency correction in parts per
# million — a property of this particular dongle's oscillator, which is
# why it belongs to the station rather than to the satellite. A real
# dongle is out by single or low double digits. Leave it at 0 until you
# have measured yours against a known-accurate signal.
ppm = 0


# ---------------------------------------------------------------------
# What your own site blocks
# ---------------------------------------------------------------------
#
# This whole section is optional. No [[horizon]] entries at all means
# no obstruction anywhere -- an honest description of a station that
# hasn't measured its horizon yet, not a placeholder standing in for a
# required survey. Every config file written before Chunk B lacks it.
#
# Each [[horizon]] entry is one measured point: a compass bearing and
# the lowest elevation usable there. Pass prediction (`qsorbit plan`)
# reads this to filter out passes that never clear your treeline, and
# live pointing can use it to say "we're blocked right now" -- the same
# data, read by two different layers, which is why it lives here rather
# than belonging to either one.
#
# Between two points the mask interpolates linearly, and past the last
# point it wraps back around to the first, since azimuth is circular.
# That means a real obstruction needs to be bracketed by 0.0 points on
# both sides, or the interpolation draws a false slope across open sky
# between it and the next real point. The two obstructions below are
# real measurements from this project's own station (Session 22) --
# replace them with your own survey, or delete the section entirely
# until you have one.
#
#[[horizon]]
#azimuth_deg = 105.0
#min_elevation_deg = 0.0
#
#[[horizon]]
#azimuth_deg = 111.0
#min_elevation_deg = 18.0
#
#[[horizon]]
#azimuth_deg = 117.0
#min_elevation_deg = 0.0
#
#[[horizon]]
#azimuth_deg = 188.0
#min_elevation_deg = 0.0
#
#[[horizon]]
#azimuth_deg = 193.0
#min_elevation_deg = 20.0
#
#[[horizon]]
#azimuth_deg = 199.0
#min_elevation_deg = 23.0
#
#[[horizon]]
#azimuth_deg = 204.0
#min_elevation_deg = 0.0
